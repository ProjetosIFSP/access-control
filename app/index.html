<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- SEO -->
    <title>Controle de Acesso — IFSP Presidente Epitácio</title>
    <meta
      name="description"
      content="Sistema de controle de acesso e gerenciamento de ambientes baseado em IoT para o IFSP Campus Presidente Epitácio. Monitore portas, gerencie credenciais e visualize acessos em tempo real."
    />
    <meta
      name="keywords"
      content="controle de acesso, IoT, IFSP, Presidente Epitácio, biometria, RFID, fechadura eletrônica, gerenciamento de salas"
    />
    <meta name="author" content="Abner José da Silva" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Controle de Acesso — IFSP Presidente Epitácio"
    />
    <meta
      property="og:description"
      content="Sistema IoT de controle de acesso e gerenciamento de ambientes com biometria e RFID para o IFSP Campus Presidente Epitácio."
    />
    <meta property="og:image" content="/app-icon.svg" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Theme: apply saved preference before first paint to avoid FOUC -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var dark = stored ? stored === "dark" : prefersDark;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>

    <!-- Theme -->
    <meta name="theme-color" content="#379936" />
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body
    class="bg-zinc-200 text-zinc-950 dark:bg-zinc-950 dark:text-zinc-50 min-h-dvh max-w-screen overflow-x-hidden [&::-webkit-scrollbar]:w-0!"
  >
    <div
      id="app"
      class="flex flex-col min-h-dvh w-screen max-w-screen overflow-x-hidden"
    ></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
