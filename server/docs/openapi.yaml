                  type: string
                  enum:
                    - right_thumb
                    - right_index
                    - right_middle
                    - right_ring
                    - right_pinky
                    - left_thumb
                    - left_index
                    - left_middle
                    - left_ring
                    - left_pinky
                template:
                  type: string
                  minLength: 1
                enrollmentId:
                  type: string
                  minLength: 1
              required:
                - userId
                - finger
                - template
              example:
                userId: 7b3cf58e-353f-48de-b2fd-6f203d64d3f8
                finger: right_index
                template: 4152010000000000...
                enrollmentId: enroll-abc-123
        required: true
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: controllerId
          required: true
      responses:
        "201":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                  finger:
                    type: string
                    enum:
                      - right_thumb
                      - right_index
                      - right_middle
                      - right_ring
                      - right_pinky
                      - left_thumb
                      - left_index
                      - left_middle
                      - left_ring
                      - left_pinky
                  isActive:
                    type: boolean
                  createdAt:
                    type: string
                    format: date-time
                    pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                required:
                  - id
                  - finger
                  - isActive
                  - createdAt
                additionalProperties: false
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
                additionalProperties: false
        "409":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
                additionalProperties: false
  /iot/devices/{controllerId}/commands/{commandId}/ack:
    patch:
      summary: Confirmar execução de comando
      tags:
        - iot
      description: Atualiza o status de um comando após processamento pelo
        controlador, incluindo payload de resultado ou erro.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  anyOf:
                    - type: string
                      enum:
                        - COMPLETED
                    - type: string
                      enum:
                        - FAILED
                resultPayload:
                  nullable: true
                  type: object
                  additionalProperties: {}
                errorMessage:
                  nullable: true
                  type: string
              required:
                - status
              example:
                status: COMPLETED
                resultPayload:
                  doorState: UNLOCKED
                errorMessage: null
        required: true
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: controllerId
          required: true
        - schema:
            type: string
            minLength: 1
          in: path
          name: commandId
          required: true
      responses:
        "200":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  command:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                      status:
                        anyOf:
                          - type: string
                            enum:
                              - COMPLETED
                          - type: string
                            enum:
                              - FAILED
                      processedAt:
                        nullable: true
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    required:
                      - id
                      - status
                      - processedAt
                    additionalProperties: false
                required:
                  - command
                additionalProperties: false
                example:
                  command:
                    id: 6d2dbfb1-9a90-4f49-9af2-6520f9a2c2f5
                    status: COMPLETED
                    processedAt: 2025-02-20T14:58:30.000Z
        "404":
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - Command not found
                  code:
                    type: string
                    enum:
                      - COMMAND_NOT_FOUND
                required:
                  - error
                  - code
                additionalProperties: false
                example:
                  error: Command not found
                  code: COMMAND_NOT_FOUND
